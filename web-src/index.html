*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

label{display:block;font-size:12px;color:var(--mut);margin:9px 0 4px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}

html.fit,html.fit body{overscroll-behavior-y:none}

.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.line{border-top:1px solid var(--line);padding:11px 2px}
.line:first-child{border-top:0}

.lmain{display:flex;gap:10px;align-items:flex-start;cursor:pointer}

.ld{flex:1;min-width:0}

.lmatch{font-size:12.5px;color:var(--mut);margin-top:1px}

.reasons{font-size:12.5px;color:var(--amb);margin:6px 0 0 42px}
.quick{margin:8px 0 0 42px}
.tag{display:inline-block;font-size:11.5px;font-weight:750;padding:3px 8px;border-radius:20px;margin-top:3px}
.t-over{background:var(--reds);color:var(--red)}.t-ok{background:var(--accs);color:var(--grn)}
.t-none{background:var(--ambs);color:var(--amb)}.t-ex{background:var(--soft);color:var(--mut)}
.t-up{background:var(--golds);color:var(--amb)}
.edit{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
.edit .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.warn{background:var(--ambs);color:var(--amb);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.err{background:var(--reds);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.info{background:var(--accs);color:var(--grn);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p2),var(--gold),var(--p2));background-size:200% 100%;animation:flow 1.4s linear infinite;transition:width .35s}
.skel{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:flow 1.3s linear infinite}
.photo{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.cat{font-size:11.5px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 6px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.item:active{background:var(--soft)}
.item:first-child{border-top:0}
.item .p{font-weight:750;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:var(--card);padding:10px 14px 10px 16px;border-radius:24px;font-size:14px;z-index:40;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:normal;text-align:center;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast button{border:0;background:transparent;color:var(--gold);font-weight:750;font-size:14px;padding:0}
.hist{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.over{color:var(--red);font-weight:750}
.empty{text-align:center;padding:26px 8px;color:var(--mut)}
details summary{cursor:pointer;color:var(--acc);font-weight:650;font-size:13px;margin-top:8px}
.sheet-inline{border:1.5px solid var(--acc);box-shadow:0 14px 40px rgba(0,0,0,.14);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
/* pop-up sheets that slide up from the bottom, like an iPhone app */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;animation:fadeIn .22s ease;-webkit-tap-highlight-color:transparent}
.sheetbg.out{opacity:0;transition:opacity .22s}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0;max-height:calc(100vh - env(safe-area-inset-top) - 24px);max-height:calc(100dvh - env(safe-area-inset-top) - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  border:0;border-radius:22px 22px 0 0;padding:26px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetUp .34s cubic-bezier(.2,.9,.25,1);transition:transform .26s cubic-bezier(.2,.9,.25,1)}
.bsheet.drag{transition:none}
.bsheet.out{transform:translateY(105%)}

@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.grab{position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
.sheetx{position:sticky;top:-18px;float:right;margin:-14px -6px 0 8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--soft,rgba(127,127,127,.15));color:var(--mut);font:600 15px/32px inherit;text-align:center;padding:0;z-index:2}

html.modal-open,html.modal-open body{overflow:hidden}
.steps{margin:6px 0 0;padding-left:20px}.steps li{margin:7px 0}

.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin:14px 0 4px}

.bars .f{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#e2675a,var(--red));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;min-height:3px}

.kv{display:flex;justify-content:space-between;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}

.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tog:checked{background:var(--p2)}.tog:checked::after{transform:translateX(18px)}
.anim{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.fade{animation:fadeIn .3s ease both}
.popin{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}

/* smooth, native-feeling motion */
html{background:var(--bg);scroll-behavior:auto}
body{min-height:100vh;box-sizing:border-box}
#main{transform-origin:50% 0}
#main.tabIn{animation:tabIn .38s cubic-bezier(.22,.9,.24,1) both}
#main.tabIn.fromR{--tx:26px}#main.tabIn.fromL{--tx:-26px}
@keyframes tabIn{from{opacity:0;transform:translateX(var(--tx,0)) translateY(6px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(18px) scale(.985);transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1)}

.card,.item,.btn,.chip,nav button{-webkit-user-select:none;user-select:none}

.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.chip:active,.hist:active{transform:scale(.97)}

.sw{position:relative;overflow:hidden;border-top:1px solid var(--line);transition:height .28s cubic-bezier(.2,.8,.2,1),opacity .28s}

/* ---------- matching (with confidence) ---------- */
const STOP = new Set(["fresh","halal","the","and","of","x","pcs","pc","kg","ltd","ltrs","ltr","lt","l"]);
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9.]+/g," ").replace(/\s+/g," ").trim();
const toks = s => norm(s).split(" ").filter(t => t && !STOP.has(t) && (t.length>1 || /\d/.test(t)));
function tokEq(a,b){ return a===b || (a.length>=4 && b.length>=4 && (a.startsWith(b)||b.startsWith(a))); }
function scoreItem(desc, item){
  const d = norm(desc), dt = toks(desc);
  let best = 0;
  for(const al of (item.aliases||[])){
    const at = norm(al).split(" ").filter(Boolean);
    if(!at.length) continue;
    if(at.every(t => dt.some(x => tokEq(x,t)) || d.includes(t))) best = Math.max(best, 1 + at.join("").length/100);
  }
  if(best) return best;
  const it = toks(item.name);
  if(!it.length || !dt.length) return 0;
  let hit = 0; for(const t of dt) if(it.some(x => tokEq(x,t))) hit++;
  return (2*hit)/(dt.length+it.length);
}
function suggestions(desc, n){
  return S.baseline.map(it => ({ it, s: scoreItem(desc, it) })).filter(x => x.s >= 0.2).sort((a, b) => b.s - a.s).slice(0, n || 3).map(x => x.it);
}
function matchInfo(desc){
  let best = null, bs = 0, second = 0;
  for(const it of S.baseline){
    const s = scoreItem(desc, it);
    if(s > bs){ second = bs; bs = s; best = it; } else if(s > second) second = s;
  }
  if(!best || bs < 0.55) return { id: null, conf: null };
  const alias = bs >= 1;
  const clear = alias ? (second < 1 || bs - second >= 0.02) : (bs >= 0.8 && bs - second >= 0.15);
  return { id: best.id, conf: clear ? "high" : "low" };
}

/* ---------- maths ---------- */
function sameSupplier(a, b){
  a = cleanSupplier(a).toLowerCase(); b = cleanSupplier(b).toLowerCase();
  if(!a || !b) return false;
  if(a === b || a.includes(b) || b.includes(a)) return true;
  return descSim(a, b) >= 0.5;
}
// the price to compare with: this supplier's agreed price if you've set one, otherwise your standard price
function basePrice(item, supplier){
  const sp = (item.sp || []).find(x => sameSupplier(x.s, supplier));
  return sp ? { price: sp.p, sp } : { price: item.price, sp: null };
}
function linkLines(inv){ for(const l of inv.lines) if(l._inv !== inv) Object.defineProperty(l, "_inv", { value: inv, writable: true, configurable: true, enumerable: false }); }
function lineCalc(l){
  const item = l.matchId ? itemById(l.matchId) : null;
  const net = r2(l.qty * l.unit), vat = r2(net * (l.vat||0) / 100);
  const bp = item ? basePrice(item, l._inv ? l._inv.supplier : "") : null;
  const res = { item, net, vat, base: bp ? bp.price : null, sp: bp ? bp.sp : null, diff: 0, over: 0, overVat: 0, under: 0 };
  if(item && !l.excluded){
    res.diff = r2(l.unit - bp.price);
    const tol = Math.max(0.01, S.cfg.tol || 0.01);
    if(res.diff >= tol - 1e-9){ res.over = r2(res.diff * l.qty); res.overVat = r2(res.over * (l.vat||0) / 100); }
    else if(res.diff <= -0.01) res.under = r2(-res.diff * l.qty);
  }
  return res;
}
function lineReasons(l, totalOk){
  if(l.excluded || l.ok) return [];
  const r = [];
  if(l.warn && !totalOk) r.push(l.warn);
  if(l.disagree && !totalOk) r.push("The two reads of the photo didn't agree on this line.");
  if(l.onlyB) r.push("Only found on the second read – make sure it's really on the invoice.");
  if(!l.matchId && !l.noBase) r.push("Not in your price list – choose the matching item or mark it as not in your list.");

  if(reading) hero = `<div class="hero wait"><div class="k">Reading and double-checking…</div><div class="skel" style="width:60%;margin:14px auto 4px"></div><div class="skel" style="width:40%;margin:8px auto"></div></div>`;
  else if(review.length && !S.showAnyway) hero = `<div class="hero rev popin"><div class="k">Almost there</div><div class="v" style="font-size:30px">${plural(t.reviewCount, "item")} to confirm</div>
      <div class="small">Confirm these so your result is 100% right.</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn gold" data-act="startReview">Review now</button><button class="btn sm ghost" data-act="showAnyway">Show result anyway</button></div></div>`;
  else if(t.over > 0) hero = `<div class="hero bad"><div class="k">You were overcharged</div><div class="v" data-count="${t.over}" data-key="o${t.over}">${money(t.over)}</div>
      <div class="small">before VAT${t.overVat > 0 ? " · " + money(t.over + t.overVat) + " incl. VAT" : ""}</div>${allChecked ? `<div class="verified popin">✓ Double-checked</div>` : `<div class="verified" style="color:var(--amb)">Not fully checked</div>`}</div>`;
  else if(t.unmatched && t.unmatched === S.invoices.reduce((a, i) => a + i.lines.filter(l => !l.excluded).length, 0))
    hero = `<div class="hero rev"><div class="k">Nothing to compare yet</div><div class="small" style="margin-top:6px">None of these items are in your price list. Add them in Prices so they can be checked.</div></div>`;
  else hero = `<div class="hero good"><div class="k">No overcharges found</div><div class="v popin">✓</div>${allChecked ? `<div class="verified">✓ Double-checked</div>` : ""}</div>`;
  h += `<div class="card${A("sum",1)}">${hero}`;
  if(!reading){
    const passes2 = S.invoices.every(i => i.passes === 2 || !i.photo);
    const lines = S.invoices.reduce((a, i) => a + i.lines.length, 0);
    const agreed = S.invoices.reduce((a, i) => a + i.lines.filter(l => l.reads >= 2).length, 0);
    const totalsOk = S.invoices.filter(i => invCalc(i).totalOk).length, totalsKnown = S.invoices.filter(i => i.printedNet).length;
    const matched = S.invoices.reduce((a, i) => a + i.lines.filter(l => l.excluded || l.noBase || (l.matchId && (l.conf === "high" || l.ok))).length, 0);
    const ic = ok => ok ? `<span class="ic" style="color:var(--grn)">✓</span>` : `<span class="ic" style="color:var(--amb)">!</span>`;
    h += `<ul class="checks">
      ${S.invoices.some(i => i.photo) ? `<li>${ic(passes2)}<span>${passes2 ? `Every photo read twice and compared (${agreed} of ${lines} lines identical)` : "Read once – double-check is off in Settings"}</span></li>` : ""}
      ${totalsKnown ? `<li>${ic(totalsOk === totalsKnown)}<span>Lines add up to the invoice total on ${totalsOk} of ${plural(totalsKnown,"invoice")}</span></li>` : ""}
      <li>${ic(matched === lines)}<span>${matched} of ${lines} items matched to your prices with confidence</span></li>
    </ul>`;
    h += `<div class="stats">
      ${statBox("Invoice total (ex VAT)", money(t.net))}
      ${statBox("Should have been", money(t.beforeNet))}
      ${statBox("Total incl. VAT", money(t.total))}
      ${statBox(S.invoices.length > 1 ? "Invoices" : "Lines", S.invoices.length > 1 ? S.invoices.length : lines)}
    </div>
    ${t.under > 0 || t.excluded > 0 ? `<div class="small mut">${t.under > 0 ? "Cheaper than your price on some lines: " + money(t.under) + ". " : ""}${t.excluded > 0 ? "Missing/returned to be credited: " + money(t.excluded) + "." : ""}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn sm pri" data-act="credit">Request credit</button><button class="btn sm" data-act="copy">Copy summary</button>
      ${S.cfg.autosave ? "" : `<button class="btn sm" data-act="saveAll">Save to reports</button>`}<span class="grow"></span><button class="btn sm danger" data-act="clearAll">Clear</button></div>`;
  }
  h += `</div>`;
  S.invoices.forEach((inv, i) => h += viewInvoice(inv, i));
  return h;
}

function viewInvoice(inv, idx){
  const st = invState(inv);
  let h = `<div class="card${A("inv"+inv.id, idx+2)}" id="inv-${inv.id}">
  <div class="invhead"><div><b>${esc(inv.supplier || "Invoice " + (idx+1))}</b>${inv.invNo ? ` <span class="mut">#${esc(inv.invNo)}</span>` : ""}${(S.cfg.shops||[]).length ? `<div class="small mut">🏪 <select data-f="shopId" data-inv="${inv.id}" style="width:auto;padding:3px 8px;font-size:12.5px">${["", ...S.cfg.shops.map(x => x.id)].map(id => `<option value="${id}" ${inv.shopId === id ? "selected" : ""}>${esc(id ? shopName(id) : "No shop")}</option>`).join("")}</select></div>` : ""}</div>

  const dup = dupOf(inv);
  if(dup) h += `<div class="warn">Looks like you've already checked this invoice${dup.savedAt ? " (on " + new Date(dup.savedAt).toLocaleDateString("en-GB") + ")" : ""}.</div>`;
  const c = invCalc(inv);
  if(c.totalProblem) h += `<div class="warn"><b>Totals don't match.</b> The invoice says ${money(inv.printedNet)} before VAT but the lines read add up to ${money(c.net)} – a line is probably misread or missing. Compare with the photo, fix it, or
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="viewPhoto" data-inv="${inv.id}">Show photo</button><button class="btn sm" data-act="ackTotal" data-inv="${inv.id}">I've checked – it's right</button></div></div>`;

  if(inv.photo) h += `<details id="ph-${inv.id}"><summary>Show photo</summary><img class="photo" src="${inv.photo}" alt="Invoice photo"></details>`;
  return h + `</div>`;
}

function viewLine(inv, l, i){

      h += `<select data-lf="matchId" data-key="${key}" style="width:auto;flex:1;min-width:150px"><option value="">${"Choose from your prices…"}</option>${S.baseline.map(it => `<option value="${it.id}">${esc(it.name)} – ${money(it.price)}</option>`).join("")}</select>
        <button class="btn sm" data-act="noBase" data-key="${key}">Not in my list</button>`;
    } else h += `<button class="btn sm pri" data-act="confirmLine" data-key="${key}">✓ Looks right</button>`;
    if(l.disagree && l.alt) h += `<button class="btn sm" data-act="useAlt" data-key="${key}">Use ${num(l.alt.qty) || num(l.qty) || 1}× ${money(l.alt.unit)}</button>`;
    h += `<button class="btn sm" data-act="toggleLine" data-key="${key}">Edit</button></div>`;
  }
  if(S.openLine === key){
    const opts = S.baseline.map(it => `<option value="${it.id}" ${it.id === l.matchId ? "selected" : ""}>${esc(it.name)} – ${money(it.price)}</option>`).join("");
    h += `<div class="edit fade">
      ${reasons.length ? `<div class="warn">${reasons.map(esc).join("<br>")}</div>` : ""}
      ${pp ? `<div class="small mut">Last time this was ${money(pp.unit)}${pp.date ? " (" + esc(pp.date) + ")" : ""}.</div>` : ""}
      <label>Description</label><input data-lf="desc" data-key="${key}" value="${esc(l.desc)}">
      <div class="g">
        <div><label>Qty</label><input type="number" inputmode="decimal" step="any" data-lf="qty" data-key="${key}" value="${l.qty}"></div>
        <div><label>Unit price £</label><input type="number" inputmode="decimal" step="0.01" data-lf="unit" data-key="${key}" value="${l.unit}"></div>
        <div><label>VAT</label><select data-lf="vat" data-key="${key}">${[0,5,20].map(v => `<option value="${v}" ${+l.vat === v ? "selected" : ""}>${v}%</option>`).join("")}</select></div>
      </div>
      <label>Compare with</label>

  h += `</div><p class="foot">ChargeCheck © 2026 RJ. All rights reserved.</p>`;

function monthKey(e){
  const m = String(e.date || "").match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; return y + "-" + String(+m[2]).padStart(2, "0"); }
  return (e.savedAt || "").slice(0, 7);
}
/* ---------- what to pay your suppliers: invoice totals less overcharges and missing items ---------- */
const paySkip = new Set(lsGet("ic.paySkip", []));
function payCalc(e){
  const exVat = (e.lines || []).filter(l => l.excluded).reduce((a, l) => a + r2(r2(num(l.qty) * num(l.unit)) * (num(l.vat) || 0) / 100), 0);
  const total = r2(e.total != null ? e.total : e.net || 0);
  const less = Math.min(total, r2((e.over || 0) + (e.overVat || 0) + (e.excluded || 0) + exVat));
  return { total, less, pay: r2(total - less), miss: (e.excluded || 0) > 0 };
}
function payGroups(H){
  const unpaid = H.filter(e => !e.paid), sel = unpaid.filter(e => !paySkip.has(e.id)), g = {};
  for(const e of sel){ const k = e.supplier || "Unknown supplier", c = payCalc(e); g[k] = g[k] || { n: 0, total: 0, less: 0, pay: 0, list: [] };
    g[k].n++; g[k].miss = g[k].miss || c.miss; g[k].total += c.total; g[k].less += c.less; g[k].pay += c.pay; g[k].list.push(e); }
  const sups = Object.entries(g).sort((a, b) => b[1].pay - a[1].pay);
  const sum = k => r2(sups.reduce((a, [, v]) => a + v[k], 0));
  return { unpaid, sel, sups, total: sum("total"), less: sum("less"), pay: sum("pay") };
}
const repHistory = () => S.repShop ? S.history.filter(e => e.shopId === S.repShop) : S.history;
function payCard(H){
  const P = payGroups(H);
  if(!P.unpaid.length) return `<div class="card${A("rpay",0)}"><h3 style="margin-bottom:4px">To pay</h3><div class="small mut">Nothing to pay – every checked invoice is marked as paid.</div></div>`;
  return `<div class="card${A("rpay",0)}" id="payCard"><div class="row" style="flex-wrap:nowrap"><h3 class="grow" style="margin:0">To pay</h3><button class="btn sm" data-act="payChoose">☑️ Choose invoices</button></div>
    <div class="small mut" style="margin:4px 0 8px">${P.sel.length} of ${plural(P.unpaid.length, "unpaid invoice")} selected · includes VAT</div>
    ${P.sel.length ? `${P.sups.map(([n, v]) => `<div class="kv" style="align-items:flex-start"><span>${esc(n)} <span class="mut small">· ${plural(v.n, "invoice")}</span><br><span class="small mut">Invoiced ${money(v.total)}${v.less > 0 ? ` − ${money(v.less)} ${v.miss ? "overcharged / missing" : "overcharged"}` : ""}</span></span><b style="white-space:nowrap">${money(v.pay)}</b></div>`).join("")}
    <div class="stats" style="margin:10px 0 0">${statBox("Invoice totals", money(P.total))}${statBox(P.sups.some(([, v]) => v.miss) ? "Overcharged / missing – take off" : "Overcharged – take off", `<span style="color:var(--red)">${P.less > 0 ? "−" : ""}${money(P.less)}</span>`)}</div>
    <div style="background:var(--accs);border-radius:12px;padding:12px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-weight:650">Amount to pay</span><span style="font-size:24px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums">${money(P.pay)}</span></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="payCopy">Copy breakdown</button><span class="grow"></span><button class="btn sm pri" data-act="payDone">✓ Mark as paid</button></div>`
    : `<div class="info">No invoices selected. Tap <b>Choose invoices</b> to pick the ones you're paying.</div>`}</div>`;
}
function payChooseSheet(){
  const H = repHistory().filter(e => !e.paid);
  const sups = [...new Set(H.map(e => e.supplier || "Unknown supplier"))];
  openModal(`<h3 style="margin-top:0">Choose invoices to pay</h3>

function entryDate(e){
  const m = String(e.date || "").match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; const d = new Date(y, +m[2] - 1, +m[1]); if(!isNaN(d)) return d; }
  const d = new Date(e.savedAt || 0); return isNaN(d) ? new Date(0) : d;
}
function periodRange(p, from, to){
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const taxStart = (now >= new Date(y, 3, 6)) ? y : y - 1;   // UK tax year starts 6 April
  const R = {
    thisMonth:  [new Date(y, mo, 1), new Date(y, mo + 1, 0), "This month"],
    lastMonth:  [new Date(y, mo - 1, 1), new Date(y, mo, 0), "Last month"],
    last3:      [new Date(y, mo - 2, 1), new Date(y, mo + 1, 0), "Last 3 months"],
    thisTax:    [new Date(taxStart, 3, 6), new Date(taxStart + 1, 3, 5), `Tax year ${taxStart}/${String(taxStart + 1).slice(2)}`],
    lastTax:    [new Date(taxStart - 1, 3, 6), new Date(taxStart, 3, 5), `Tax year ${taxStart - 1}/${String(taxStart).slice(2)}`],
    thisYear:   [new Date(y, 0, 1), new Date(y, 11, 31), String(y)],
    all:        [new Date(2000, 0, 1), new Date(2100, 0, 1), "All time"],
  };
  if(p === "custom"){
    const f = from ? new Date(from) : new Date(2000, 0, 1), t = to ? new Date(to) : new Date(2100, 0, 1);
    return [f, t, `${from ? f.toLocaleDateString("en-GB") : "start"} – ${to ? t.toLocaleDateString("en-GB") : "today"}`];
  }
  return R[p] || R.all;
}
function exportEntries(o){
  const [f, t] = periodRange(o.period, o.from, o.to);
  const end = new Date(t.getFullYear(), t.getMonth(), t.getDate(), 23, 59, 59);
  return S.history.filter(e => (!o.shop || e.shopId === o.shop) && entryDate(e) >= f && entryDate(e) <= end)
    .sort((a, b) => entryDate(a) - entryDate(b));
}

async function withBusy(el, label, fn){

/* ---------- swipe to edit / delete ---------- */
const SW = { row: null, x0: 0, y0: 0, base: 0, dx: 0, mode: null, open: null, W: 156 };
function swClose(row, instant){ if(!row) return; const it = row.querySelector(".item"); clearTimeout(row._actT); row._actT = setTimeout(() => { if(!/translateX\(-/.test(it.style.transform)) row.classList.remove("act"); }, instant ? 0 : 360); row.classList.remove("full"); if(instant) row.classList.add("drag"); it.style.transform = ""; if(instant) requestAnimationFrame(() => row.classList.remove("drag")); if(SW.open === row) SW.open = null; }
function swDelete(id, row){
  const idx = S.baseline.findIndex(i => i.id === id); if(idx < 0) return;
  const doIt = () => {
    const [it] = S.baseline.splice(idx, 1); saveBaseline(); render();
    toast(`Deleted “${it.name}”`, () => { S.baseline.splice(idx, 0, it); saveBaseline(); render(); });
  };
  if(row){ row.style.height = row.offsetHeight + "px"; row.classList.add("full"); row.querySelector(".item").style.transform = "translateX(-100%)";
    requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add("gone"))); setTimeout(doIt, 300); }

}
document.addEventListener("touchstart", ev => {
  const row = ev.target.closest && ev.target.closest(".sw");
  if(SW.open && SW.open !== row) swClose(SW.open);
  if(!row || ev.target.closest(".sw-act")) return;
  const t = ev.touches[0]; const it = row.querySelector(".item");
  SW.row = row; SW.x0 = t.clientX; SW.y0 = t.clientY; SW.dx = 0; SW.mode = null;
  const m = /translateX\((-?[\d.]+)px\)/.exec(it.style.transform || ""); SW.base = m ? +m[1] : 0;
}, { passive: true });
document.addEventListener("touchmove", ev => {
  if(!SW.row) return;
  const t = ev.touches[0], dx = t.clientX - SW.x0, dy = t.clientY - SW.y0;
  if(!SW.mode){ if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return; SW.mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y"; if(SW.mode === "x"){ SW.row.classList.add("drag", "act"); clearTimeout(SW.row._actT); } }
  if(SW.mode !== "x") return;
  const W = SW.row.offsetWidth; let x = Math.min(0, SW.base + dx);
  if(x < -SW.W) x = -SW.W + (x + SW.W) * (x < -W * .55 ? 1 : .6);     // gentle resistance, then free for a full swipe
  SW.dx = x; SW.row.querySelector(".item").style.transform = `translateX(${x}px)`;
  SW.row.classList.toggle("full", x < -W * .6);
}, { passive: true });
document.addEventListener("touchend", () => {
  const row = SW.row; SW.row = null; if(!row || SW.mode !== "x") return;
  row.classList.remove("drag"); const it = row.querySelector(".item"); const W = row.offsetWidth;
  SW.justSwiped = Date.now();
  if(SW.dx < -W * .6) return swDelete(row.dataset.sw, row);
  if(SW.dx < -SW.W * .4){ it.style.transform = `translateX(${-SW.W}px)`; row.classList.remove("full"); SW.open = row; try { localStorage.setItem("ic.swiped", "true"); } catch(e){} }
  else swClose(row);

/* ---------- scroll reveal (cards and rows float in as you scroll) ---------- */
let revealIO = null;
function setupReveal(){
  if(!("IntersectionObserver" in window) || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  if(revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver(es => { for(const e of es) if(e.isIntersecting){ e.target.classList.add("in"); revealIO.unobserve(e.target); } }, { rootMargin: "0px 0px -6% 0px", threshold: 0.01 });
  const vh = window.innerHeight;
  document.querySelectorAll("#main .card, #main .sw, #main .hist, #main .line").forEach(el => {
    if(el.getBoundingClientRect().top < vh) return;             // already on screen: leave it alone
    el.classList.add("rv"); revealIO.observe(el);
  });
  setTimeout(() => document.querySelectorAll("#main .rv:not(.in)").forEach(el => { if(el.getBoundingClientRect().top < window.innerHeight) el.classList.add("in"); }), 1500);
}

const CAT_WORDS = [

/* sort items into categories: learn from the items you already sorted, otherwise use common shop words */
const UNSORTED = c => !c || /^(other|imported|uncategori[sz]ed|misc)$/i.test(String(c).trim());
const CAT_ALIAS = { "Meat & Poultry": /meat|poultry|protein|chicken/i, "Oils & Sauces": /oil|sauce|fat/i, "Dairy & Cheese": /dairy|cheese/i, "Bakery": /bak|bread|bun/i,
  "Frozen & Sides": /frozen|chip|potato|side/i, "Drinks": /drink|beverage/i, "Packaging": /pack|sundr|dispos/i, "Cleaning": /clean|hygien/i, "Dry Goods": /dry|breading|coating|spice|flour|grocer|store/i };
const CAT_STOP = new Set("fresh halal large medium small mini general pack packs with inch standard extra original premium best quality case each brown white colour color".split(" "));
function autoCat(it){
  const mine = [...new Set(S.baseline.map(o => o.cat).filter(x => !UNSORTED(x)))];
  const d = norm(it.name + " " + (it.aliases || []).join(" "));
  let kw = null;
  for(const [c, re] of CAT_WORDS) if(re.test(d)){ kw = c; break; }
  const kwMine = kw && (mine.find(x => x === kw) || mine.find(x => CAT_ALIAS[kw] && CAT_ALIAS[kw].test(x)));
  if(kwMine) return kwMine;                                   // common shop words, using your own category names
  // otherwise learn from items you've already sorted that share a word with this one
  const words = d.split(" ").filter(w => w.length >= 4 && !/\d/.test(w) && !CAT_STOP.has(w));
  const votes = {};
  for(const o of S.baseline){ if(o === it || UNSORTED(o.cat)) continue;
    const ow = new Set(norm(o.name + " " + (o.aliases || []).join(" ")).split(" "));
    const sc = words.filter(w => ow.has(w)).length; if(sc) votes[o.cat] = (votes[o.cat] || 0) + sc; }
  const vs = Object.entries(votes).sort((a, b) => b[1] - a[1]);
  if(vs.length && (vs.length === 1 || vs[0][1] > vs[1][1])) return vs[0][0];
  return kw;
}

function guessCat(desc){

function priceHistory(it){
  const pts = [];
  for(const h of S.history){
    for(const l of (h.lines || [])){
      if(l.excluded || !(l.unit > 0)) continue;
      if(l.matchId === it.id || (l.item && norm(l.item) === norm(it.name))){ pts.push({ d: entryDate(h), p: +l.unit, s: h.supplier || "" }); break; }
    }
  }
  pts.sort((a, b) => a.d - b.d);
  const byDay = [];
  for(const q of pts){ const k = q.d.toDateString(), last = byDay[byDay.length - 1];
    if(last && last.d.toDateString() === k){ last.p = q.p; last.n++; } else byDay.push({ ...q, n: 1 }); }
  return byDay.slice(-24);
}
function priceChart(it){

/* ---------- price list import (paste or photo) ---------- */
function parsePriceList(text){
  const out = [];
  for(const raw of String(text).split(/\n/)){
    const L = raw.trim(); if(!L) continue;
    const m = L.match(/^(.*?[A-Za-z].*?)[\s,;:\t-]+£?\s*(\d{1,4}[.,]\d{2})\s*(?:[A-Za-z()\/ ]{0,12})?$/);
    if(!m) continue;
    const name = m[1].replace(/[\s,;:\-–£]+$/, "").replace(/\s{2,}/g, " ").trim();
    if(name.length < 3) continue;
    out.push({ name, price: num(m[2]) });
  }
  return out;
}
/* ---------- read Excel (.xlsx) and CSV price lists (offline) ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const d = [";", "\t", "|", ","].map(c => [c, first.split(c).length]).reduce((a, b) => b[1] > a[1] ? b : a)[0];   // ties go to ; (used where commas are decimals)
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === d){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
function parseXLSX(buf){
  const z = fflate.unzipSync(new Uint8Array(buf)), dec = new TextDecoder();
  const xml = p => z[p] ? new DOMParser().parseFromString(dec.decode(z[p]), "application/xml") : null;
  const shared = []; const ss = xml("xl/sharedStrings.xml");
  if(ss) for(const si of ss.getElementsByTagName("si")) shared.push([...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  // first sheet in workbook order
  let sheetPath = Object.keys(z).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)))[0];
  try {
    const wb = xml("xl/workbook.xml"), rels = xml("xl/_rels/workbook.xml.rels");
    const first = wb.getElementsByTagName("sheet")[0], rid = first.getAttribute("r:id") || first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    for(const r of rels.getElementsByTagName("Relationship")) if(r.getAttribute("Id") === rid){ const tg = r.getAttribute("Target").replace(/^\/?(xl\/)?/, ""); if(z["xl/" + tg]) sheetPath = "xl/" + tg; }
  } catch(e){}
  const sh = xml(sheetPath); if(!sh) throw new Error("no sheet");
  const col = ref => { let n = 0; for(const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const rows = [];
  for(const r of sh.getElementsByTagName("row")){
    const out = [];
    for(const c of r.getElementsByTagName("c")){
      const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0], ref = c.getAttribute("r") || "";
      let val = "";
      if(t === "s") val = shared[+(v && v.textContent)] || "";
      else if(t === "inlineStr") val = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else val = v ? v.textContent : "";
      out[ref ? col(ref) : out.length] = val;
    }
    rows.push(Array.from(out, x => x == null ? "" : x));
  }
  return rows.filter(r => r.some(c => String(c).trim()));
}
async function readSheetFile(f){
  const name = (f.name || "").toLowerCase();
  if(name.endsWith(".xls")) throw new Error("xls");
  const buf = await f.arrayBuffer();
  const u = new Uint8Array(buf.slice(0, 2));
  if(name.endsWith(".xlsx") || (u[0] === 0x50 && u[1] === 0x4b)) return parseXLSX(buf);
  return parseCSV(new TextDecoder().decode(buf));
}
// works out which columns hold the item name, price, supplier and category
function sheetToPrices(rows){
  const isNum = v => /^\s*[£$€]?\s*-?\d[\d,]*([.,]\d+)?\s*$/.test(String(v));
  const toNum = v => { let t = String(v).replace(/[£$€\s]/g, ""); t = /^-?\d+,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, ""); return num(t); };
  let hi = -1, map = {};
  for(let i = 0; i < Math.min(rows.length, 10); i++){
    const r = rows[i].map(c => String(c).toLowerCase().trim()); const m = {};
    r.forEach((c, j) => {
      if(m.name == null && /^(item|items|product|products|description|desc|name|item name|product name|stock|line)/.test(c)) m.name = j;
      else if(m.price == null && /(your price|agreed|price|cost|unit|rate|£|amount)/.test(c) && !/(qty|quantity|vat|total)/.test(c)) m.price = j;
      else if(m.sup == null && /(supplier|vendor|wholesaler)/.test(c)) m.sup = j;
      else if(m.cat == null && /(category|cat|group|section|department)/.test(c)) m.cat = j;
    });
    if(m.name != null && m.price != null){ hi = i; map = m; break; }
  }
  if(hi < 0){   // no header row: first mostly-text column = name, first mostly-number column = price
    const W = Math.max(...rows.map(r => r.length)); const numCols = [], txtCols = [];
    for(let j = 0; j < W; j++){ const vals = rows.map(r => r[j]).filter(v => String(v || "").trim()); const n = vals.filter(isNum).length; if(vals.length){ (n / vals.length > .6 ? numCols : txtCols).push(j); } }
    map = { name: txtCols[0], price: numCols[numCols.length - 1] };
  }
  const out = [];
  for(const r of rows.slice(hi + 1)){
    const name = String(r[map.name] ?? "").trim(), price = toNum(r[map.price] ?? "");
    if(name.length < 2 || !(price > 0) || isNum(name)) continue;
    out.push({ name, price: r2(price), supplier: map.sup != null ? String(r[map.sup] || "").trim() : "", cat: map.cat != null ? String(r[map.cat] || "").trim() : "" });
  }
  return out;
}

    readSheetFile(f).then(rows => importPreview(sheetToPrices(rows), "file")).catch(e => toast(e && e.message === "xls" ? "Old .xls files aren't supported – save it as .xlsx or CSV" : "Couldn't read that file – try saving it as .xlsx or CSV")); return; }
  if(t.id === "bfile"){ const f = t.files && t.files[0]; t.value = ""; if(!f) return;
    f.text().then(txt => { applyBackup(JSON.parse(txt), true); closeModal(); render(); toast("Restored from " + f.name); }).catch(() => toast("That file isn't a ChargeCheck backup")); return; }
  if(t.id === "pfile"){ if(t.files && t.files[0]) importFromPhoto(t.files[0]); t.value = ""; return; }
  if(t.dataset.f === "shopId" && t.dataset.inv){ const inv = S.invoices.find(i => i.id === t.dataset.inv); inv.shopId = t.value; inv.savedSig = null; render(); return toast("Moved to " + (shopName(t.value) || "no shop")); }
  if(t.dataset.f === "supplier" && t.dataset.inv){ render(); return; }
  if(t.dataset.imp !== undefined){ S.importRows[+t.dataset.imp].on = t.checked; return; }
  if(t.dataset.impp !== undefined){ S.importRows[+t.dataset.impp].price = t.value; return; }
  if(t.dataset.cfg){
    const k = t.dataset.cfg;
    S.cfg[k] = t.type === "checkbox" ? t.checked : k === "tol" ? num(t.value) : t.value;
    saveCfg(); toast("Saved"); return;
  }
  if(t.dataset.lf){
    const [, l] = findLine(t.dataset.key); if(!l) return;
    const f = t.dataset.lf;
    if(f === "qty" || f === "unit"){ l[f] = num(t.value); l.warn = ""; l.disagree = false; }
    else if(f === "vat") l.vat = num(t.value);
    else if(f === "excluded") l.excluded = t.checked;
    else if(f === "desc"){ l.desc = t.value; learnDesc(l, t.value); if(!l.ok){ const m = matchInfo(l.desc); l.matchId = m.id; l.conf = m.conf; } }
    else if(f === "matchId"){
      l.matchId = t.value || null; l.conf = "high"; l.noBase = !t.value; l.ok = true;
      if(l.matchId) learnAlias(l);
      if(S.openLine !== t.dataset.key) toast("Matched – I'll remember this");
    }
    render(); return;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset.f && t.dataset.inv){ const inv = S.invoices.find(i => i.id === t.dataset.inv); if(inv){ inv[t.dataset.f] = t.value; inv.savedSig = null; } return; }
  if(t.dataset.cfg === "biz"){ S.cfg.biz = t.value; lsSet("ic.cfg", S.cfg); return; }
  if(t.dataset.f === "search" || t.dataset.f === "histSearch"){
    S[t.dataset.f] = t.value; const pos = t.selectionStart, f = t.dataset.f; render();
    const s = document.querySelector(`[data-f="${f}"]`); s.focus(); try { s.setSelectionRange(pos, pos); } catch(e){}
  }
});
window.addEventListener("resize", movePill);

function fmtWhen(d){ return (d.getTime() - Date.now() < 3*864e5) ? d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString("en-GB"); }
function startApp(){
  if(!S.baseline.length && window.__SEED && !lsGet("ic.seeded", false)){
    S.baseline = window.__SEED.map(r => ({ id: uid(), cat: r[0], name: r[1], price: r[2], supplier: r[3], aliases: r[4] ? r[4].split("|").map(norm).filter(Boolean) : [] }));
    lsSet("ic.baseline", S.baseline); lsSet("ic.seeded", true);
  }
  document.querySelector("nav").style.display = "";
  const hb = document.querySelector('[data-act="help"]'); if(hb) hb.style.display = "";
  if(S.licence && S.licence.expires && S.licence.expires.getTime() - Date.now() < 3*864e5)
    S.licenceBanner = `<div class="warn">Trial licence – ends ${fmtWhen(S.licence.expires)}. Email RJ at r93.hamad@gmail.com for a full licence.</div>`;
  render(); requestAnimationFrame(movePill); requestAnimationFrame(setupReveal);
  autoRestore();
  if(!window.__LIC_INFO) initDb();
}
/* ---------- start (the sale edition's licence check runs before this code is unlocked) ---------- */
if(window.__LIC_INFO) S.licence = window.__LIC_INFO;
if(location.hash === "#selftest") window.__dbg = { S, render, saveCfg, credits, restoreScans, applyBackup, DEV_ID, newInvoice, mkLine, closeModal, uid };
if(window.__GATED) window.__startApp = () => { window.__appRan = true; S.sub = window.__SUB_INFO || null; startApp(); };
else startApp();
// offline install support when hosted on a normal website
try { if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){}
</script>
