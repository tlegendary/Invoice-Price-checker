# Checks the Swift version of ChargeCheck every time the swift-rewrite branch changes.
# It only checks that the code builds and the tests pass. It does NOT upload anything to the App Store.
name: Swift check
on:
  push:
    branches: [swift-rewrite]
permissions:
  contents: write
concurrency:
  group: swift-check
  cancel-in-progress: true
jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests
        run: |
          cd ChargeCheckSwift/Core
          swift --version 2>&1 | tee /tmp/core.log
          set -o pipefail
          swift test 2>&1 | tee -a /tmp/core.log
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: bash .github/save-log.sh core /tmp/core.log
  app:
    name: App build
    runs-on: macos-15
    timeout-minutes: 25
    if: ${{ !contains(github.event.head_commit.message, '[core]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          if [ ! -f ChargeCheckSwift/project.yml ]; then echo "No app project yet" | tee /tmp/app.log; exit 0; fi
          brew install xcodegen 2>&1 | tail -2
          cd ChargeCheckSwift
          xcodegen generate 2>&1 | tee /tmp/app.log
          xcodebuild -version | tee -a /tmp/app.log
          xcodebuild -project ChargeCheck.xcodeproj -scheme ChargeCheck -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/app-full.log | grep -E "error|warning: |BUILD|\*\*" | cut -c1-400 | tee -a /tmp/app.log
          ls build/Build/Products/Debug-iphonesimulator/ChargeCheck.app | tr '\n' ' ' | tee -a /tmp/app.log
      - name: Open it in a simulator and take screenshots
        run: |
          cd ChargeCheckSwift
          APP=build/Build/Products/Debug-iphonesimulator/ChargeCheck.app
          ID=com.rjapps.invoicepricechecker
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $UDID" | tee -a /tmp/app.log
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -1
          xcrun simctl install "$UDID" "$APP"
          # a backup file from the old app, to check that prices and reports carry over
          DATA=$(xcrun simctl get_app_container "$UDID" $ID data)
          mkdir -p "$DATA/Documents" && cp ci/sample-backup.json "$DATA/Documents/ChargeCheck-backup.json"
          shot() { name="$1"; shift; xcrun simctl launch "$UDID" $ID "$@" >/dev/null; sleep 7; xcrun simctl io "$UDID" screenshot "/tmp/shot-$name.png" >/dev/null 2>&1; xcrun simctl terminate "$UDID" $ID; sleep 1; }
          shot 1-first-open
          shot 2-prices -startTab prices
          shot 3-reports -startTab reports
          shot 4-settings -startTab settings
          shot 5-prices-dark-blue -startTab prices -look.mode dark -look.colour blue
          shot 6-settings-dark-purple -startTab settings -look.mode dark -look.colour purple
          ls -la /tmp/shot-*.png | tee -a /tmp/app.log
          # did it crash?
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i chargecheck | tee -a /tmp/app.log || echo "No crash reports" | tee -a /tmp/app.log
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          [ "$RESULT" != "success" ] && [ -f /tmp/app-full.log ] && { echo "---- last lines ----" >> /tmp/app.log; tail -40 /tmp/app-full.log | cut -c1-400 >> /tmp/app.log; } || true
          bash .github/save-log.sh app /tmp/app.log
