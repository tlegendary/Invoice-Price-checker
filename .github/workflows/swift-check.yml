# Checks the Swift version of ChargeCheck every time the swift-rewrite branch (or an improve/ or feature/ branch) changes.
# It only checks that the code builds and the tests pass. It does NOT upload anything to the App Store.
name: Swift check
on:
  push:
    branches: [swift-rewrite, 'improve/**', 'feature/**']
permissions:
  contents: write
concurrency:
  group: swift-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests
        run: |
          cd ChargeCheckSwift/Core
          swift --version 2>&1 | tee /tmp/core.log
          set -o pipefail
          swift test 2>&1 | tee -a /tmp/core.log
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: bash .github/save-log.sh core /tmp/core.log
  app:
    name: App build
    runs-on: macos-15
    timeout-minutes: 35
    # macOS minutes are expensive on a private repo: only when the commit message asks for it
    if: ${{ contains(github.event.head_commit.message, '[app]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run the tests and take screenshots in an iPhone simulator
        env:
          RUN_STORE_TESTS: ${{ contains(github.event.head_commit.message, '[store]') }}
        run: |
          if [ ! -f ChargeCheckSwift/project.yml ]; then echo "No app project yet" | tee /tmp/app.log; exit 0; fi
          brew install xcodegen 2>&1 | tail -2
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          cd ChargeCheckSwift
          xcodegen generate 2>&1 | tee /tmp/app.log
          xcodebuild -version | tee -a /tmp/app.log
          ID=com.rjapps.invoicepricechecker
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $UDID" | tee -a /tmp/app.log
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -1
          set +e
          xcodebuild build-for-testing -project ChargeCheck.xcodeproj -scheme ChargeCheck -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO > /tmp/app-full.log 2>&1
          BUILD=$?
          set -e
          # every piece of text in the app, as Xcode extracted it (for translating)
          cp App/Localizable.xcstrings /tmp/strings-before.xcstrings
          find build -name "*.stringsdata" > /tmp/stringsdata.txt || true
          echo "stringsdata files: $(wc -l < /tmp/stringsdata.txt)" | tee -a /tmp/app.log
          xcrun xcstringstool sync App/Localizable.xcstrings --stringsdata $(cat /tmp/stringsdata.txt | tr '\n' ' ') 2>&1 | tail -3 | tee -a /tmp/app.log || true
          cp App/Localizable.xcstrings /tmp/Localizable.xcstrings
          grep -E "error|warning: |BUILD|\*\*" /tmp/app-full.log | grep -v "appintents" | sort -u | cut -c1-400 | tee -a /tmp/app.log
          if [ $BUILD -ne 0 ]; then exit $BUILD; fi
          APP=build/Build/Products/Debug-iphonesimulator/ChargeCheck.app
          if [ -d "$APP" ]; then
            xcrun simctl uninstall "$UDID" $ID || true
            xcrun simctl install "$UDID" "$APP"
            # a backup file from the old app, to check that prices and reports carry over
            DATA=$(xcrun simctl get_app_container "$UDID" $ID data)
            mkdir -p "$DATA/Documents" && cp ci/sample-backup.json "$DATA/Documents/ChargeCheck-backup.json"
            shot() { name="$1"; wait="$2"; shift; shift; xcrun simctl launch "$UDID" $ID "$@" >/dev/null; sleep "$wait"; xcrun simctl io "$UDID" screenshot "/tmp/shot-$name.png" >/dev/null 2>&1; xcrun simctl terminate "$UDID" $ID; sleep 1; }
            shot 1-first-open 7
            shot 2-prices 5 -startTab prices
            shot 3-reports 5 -startTab reports
            shot 4-settings 5 -startTab settings
            shot 5-prices-dark-blue 5 -startTab prices -look.mode dark -look.colour blue
            shot 7-sample-invoice 25 -demoScan YES
            shot 8-sample-sideways 30 -demoScan sideways
            shot 10-check-free 6 -startTab check
            shot 11-export 6 -startTab reports -demoExport YES
            shot 12-price-history 6 -startTab prices -demoPrice s1
            shot 13-reports-before-vat 6 -startTab reports -pay.beforeVat YES
            shot 14-invoice-credit 8 -startTab reports -demoReport YES
            shot 15-invoice-credit-asked 8 -startTab reports -demoReport YES -demoCredit YES
            shot 16-photo-dark 25 -demoScan dark
            # the app in each language (right-to-left for Arabic and Kurdish)
            shot 20-ar-settings 6 -startTab settings -AppleLanguages "(ar)" -AppleLocale ar_IQ
            shot 21-ckb-reports 6 -startTab reports -AppleLanguages "(ckb)" -AppleLocale ckb_IQ
            shot 22-de-sample 25 -demoScan YES -AppleLanguages "(de)" -AppleLocale de_DE
            shot 23-fr-prices 6 -startTab prices -AppleLanguages "(fr)" -AppleLocale fr_FR
            shot 24-ckb-check 6 -startTab check -AppleLanguages "(ckb)" -AppleLocale ckb_IQ
            # supplier accounts
            shot 30-suppliers 6 -startTab suppliers
            shot 31-supplier-detail 7 -startTab suppliers -demoSupplier YES
            shot 32-ckb-suppliers 6 -startTab suppliers -AppleLanguages "(ckb)" -AppleLocale ckb_IQ
            shot 33-supplier-detail-receipt 7 -startTab suppliers -demoSupplier YES
            shot 40-home 6 -startTab home
            shot 41-more 5 -startTab more
            shot 42-recently-deleted 5 -startTab deleted
            shot 43-history 5 -startTab history
            shot 44-ar-home 6 -startTab home -AppleLanguages "(ar)" -AppleLocale ar_IQ
            # plans: free, scan packs and Pro
            shot 50-free-home 6 -startTab home -test.tier free
            shot 51-free-more 5 -startTab more -test.tier free
            shot 52-free-supplier 7 -startTab suppliers -demoSupplier YES -test.tier free
            shot 53-pack-reports 5 -startTab reports -test.tier packs
            shot 54-pro-supplier 7 -startTab suppliers -demoSupplier YES -test.tier pro
            shot 55-plans 6 -startTab home -test.tier free -showPaywall YES
            # two shops: everything follows the chosen shop (Pro, so the shop screens aren't locked)
            shot 60-shops-home-all 7 -startTab home -test.tier pro -demoShops YES -demoView all
            shot 61-shops-home-one 6 -startTab home -test.tier pro -demoShops YES -demoView demo-1
            shot 62-shops-suppliers-one 6 -startTab suppliers -test.tier pro -demoShops YES -demoView demo-1
            shot 63-shops-reports-one 6 -startTab reports -test.tier pro -demoShops YES -demoView demo-2
            # the PDFs and the automatic backup the app wrote
            ls -R "$DATA/Documents" | tr '\n' ' ' | cut -c1-600 | tee -a /tmp/app.log
            cp "$DATA/Documents/Exports/"*.pdf /tmp/ 2>/dev/null || true
            ls /tmp/shot-*.png | tr '\n' ' ' | tee -a /tmp/app.log
            ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i chargecheck | tee -a /tmp/app.log || echo "No crash reports" | tee -a /tmp/app.log
          fi
          # The purchase tests buy every product against Apple's StoreKit test server. They are slow,
          # so they only run when the commit message contains [store].
          if [ "$RUN_STORE_TESTS" = "true" ]; then
            set +e
            xcodebuild test-without-building -project ChargeCheck.xcodeproj -scheme ChargeCheck -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 > /tmp/tests-full.log 2>&1
            TESTS=$?
            set -e
            grep -E "error|\*\*|Test Case|XCTAssert|Executed" /tmp/tests-full.log | sort -u | cut -c1-400 | tee -a /tmp/app.log
            cp /tmp/tests-full.log /tmp/app-full.log
            exit $TESTS
          fi
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          [ "$RESULT" != "success" ] && [ -f /tmp/app-full.log ] && { echo "---- last lines ----" >> /tmp/app.log; tail -40 /tmp/app-full.log | cut -c1-400 >> /tmp/app.log; } || true
          bash .github/save-log.sh app /tmp/app.log
  store:
    # App Store screenshots: the real app on the largest iPhone (6.9"), with realistic shop data, in every listing
    # language. Only runs when a commit message contains [shots]. Pictures are kept on the ci-logs branch (store/).
    name: App Store screenshots
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ contains(github.event.head_commit.message, '[shots]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and take the screenshots
        run: |
          brew install xcodegen 2>&1 | tail -2
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          cd ChargeCheckSwift
          xcodegen generate > /tmp/store.log 2>&1
          ID=com.rjapps.invoicepricechecker
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $(xcrun simctl list devices available | grep $UDID)" | tee -a /tmp/store.log
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -1
          xcodebuild build -project ChargeCheck.xcodeproj -scheme ChargeCheck -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO > /tmp/store-build.log 2>&1 || { tail -40 /tmp/store-build.log | tee -a /tmp/store.log; exit 1; }
          APP=build/Build/Products/Debug-iphonesimulator/ChargeCheck.app
          # a clean status bar, like Apple's own screenshots
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          mkdir -p /tmp/store
          # language, locale, currency
          for spec in "en en_GB GBP" "ar ar_GB GBP" "de de_DE EUR" "fr fr_FR EUR"; do
            set -- $spec; L=$1; LOC=$2; CUR=$3
            xcrun simctl uninstall "$UDID" $ID || true
            xcrun simctl install "$UDID" "$APP"
            DATA=$(xcrun simctl get_app_container "$UDID" $ID data)
            mkdir -p "$DATA/Documents"
            python3 -I tools/make-store-data.py "$DATA/Documents/ChargeCheck-backup.json"
            COMMON="-AppleLanguages ($L) -AppleLocale $LOC -money.currency $CUR -test.tier pro -storeShots YES"
            shot() { name="$1"; wait="$2"; shift; shift
              xcrun simctl launch "$UDID" $ID $COMMON "$@" >/dev/null; sleep "$wait"
              xcrun simctl io "$UDID" screenshot "/tmp/store/$L-$name.png" >/dev/null 2>&1
              xcrun simctl terminate "$UDID" $ID; sleep 1; }
            shot 0-first 8 -startTab home
            shot 1-scan 30 -demoScan YES
            shot 2-home 6 -startTab home -demoView all
            shot 3-suppliers 6 -startTab suppliers
            shot 4-supplier 7 -startTab suppliers -demoSupplier YES
            shot 5-credit 8 -startTab reports -demoReport YES -demoCredit YES
            shot 6-price 7 -startTab prices -demoPrice wings
            shot 7-shop 6 -startTab home -demoView s-high
            shot 8-reports 6 -startTab reports -demoView all
            echo "$L: $(ls /tmp/store | grep -c "^$L-") pictures" | tee -a /tmp/store.log
          done
      - name: Keep the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: bash .github/save-log.sh store /tmp/store.log
  archive:
    # The same kind of build Codemagic makes for TestFlight (release, real device), without signing,
    # so its errors can be read. Only runs when a commit message contains [archive].
    name: Release build
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ contains(github.event.head_commit.message, '[archive]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Release build for a real iPhone
        run: |
          brew install xcodegen 2>&1 | tail -2
          ls /Applications | grep -i xcode | tr '\n' ' ' | tee /tmp/archive.log
          NEWEST=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          cd ChargeCheckSwift
          xcodegen generate 2>&1 | tee -a /tmp/archive.log
          xcodebuild -version | tee -a /tmp/archive.log
          set +e
          xcodebuild archive -project ChargeCheck.xcodeproj -scheme ChargeCheck -configuration Release -destination "generic/platform=iOS" \
            -archivePath /tmp/cc.xcarchive CODE_SIGNING_ALLOWED=NO > /tmp/archive-full.log 2>&1
          CODE=$?
          grep -E "error|warning: unre|\*\* ARCHIVE" /tmp/archive-full.log | sort -u | cut -c1-500 | head -60 | tee -a /tmp/archive.log
          [ $CODE -ne 0 ] && tail -30 /tmp/archive-full.log | cut -c1-400 | tee -a /tmp/archive.log
          exit $CODE
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: bash .github/save-log.sh archive /tmp/archive.log
