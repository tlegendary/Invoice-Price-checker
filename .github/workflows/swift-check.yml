# Checks the Swift version of ChargeCheck every time the swift-rewrite branch changes.
# It only checks that the code builds and the tests pass. It does NOT upload anything to the App Store.
name: Swift check
on:
  push:
    branches: [swift-rewrite]
permissions:
  contents: write
concurrency:
  group: swift-check
  cancel-in-progress: true
jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests
        run: |
          cd ChargeCheckSwift/Core
          swift --version 2>&1 | tee /tmp/core.log
          set -o pipefail
          swift test 2>&1 | tee -a /tmp/core.log
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: bash .github/save-log.sh core /tmp/core.log
  app:
    name: App build
    runs-on: macos-15
    timeout-minutes: 35
    if: ${{ !contains(github.event.head_commit.message, '[core]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run the tests and take screenshots in an iPhone simulator
        env:
          RUN_STORE_TESTS: ${{ contains(github.event.head_commit.message, '[store]') }}
        run: |
          if [ ! -f ChargeCheckSwift/project.yml ]; then echo "No app project yet" | tee /tmp/app.log; exit 0; fi
          brew install xcodegen 2>&1 | tail -2
          cd ChargeCheckSwift
          xcodegen generate 2>&1 | tee /tmp/app.log
          xcodebuild -version | tee -a /tmp/app.log
          ID=com.rjapps.invoicepricechecker
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $UDID" | tee -a /tmp/app.log
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -1
          set +e
          xcodebuild build-for-testing -project ChargeCheck.xcodeproj -scheme ChargeCheck -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO > /tmp/app-full.log 2>&1
          BUILD=$?
          set -e
          grep -E "error|warning: |BUILD|\*\*" /tmp/app-full.log | grep -v "appintents" | sort -u | cut -c1-400 | tee -a /tmp/app.log
          if [ $BUILD -ne 0 ]; then exit $BUILD; fi
          APP=build/Build/Products/Debug-iphonesimulator/ChargeCheck.app
          if [ -d "$APP" ]; then
            xcrun simctl uninstall "$UDID" $ID || true
            xcrun simctl install "$UDID" "$APP"
            # a backup file from the old app, to check that prices and reports carry over
            DATA=$(xcrun simctl get_app_container "$UDID" $ID data)
            mkdir -p "$DATA/Documents" && cp ci/sample-backup.json "$DATA/Documents/ChargeCheck-backup.json"
            shot() { name="$1"; wait="$2"; shift; shift; xcrun simctl launch "$UDID" $ID "$@" >/dev/null; sleep "$wait"; xcrun simctl io "$UDID" screenshot "/tmp/shot-$name.png" >/dev/null 2>&1; xcrun simctl terminate "$UDID" $ID; sleep 1; }
            shot 1-first-open 7
            shot 2-prices 5 -startTab prices
            shot 3-reports 5 -startTab reports
            shot 4-settings 5 -startTab settings
            shot 5-prices-dark-blue 5 -startTab prices -look.mode dark -look.colour blue
            shot 7-sample-invoice 25 -demoScan YES
            shot 8-sample-sideways 30 -demoScan sideways
            shot 10-check-free 6 -startTab check
            shot 11-export 6 -startTab reports -demoExport YES
            shot 12-price-history 6 -startTab prices -demoPrice s1
            # the PDFs and the automatic backup the app wrote
            ls -R "$DATA/Documents" | tr '\n' ' ' | cut -c1-600 | tee -a /tmp/app.log
            cp "$DATA/Documents/Exports/"*.pdf /tmp/ 2>/dev/null || true
            ls /tmp/shot-*.png | tr '\n' ' ' | tee -a /tmp/app.log
            ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i chargecheck | tee -a /tmp/app.log || echo "No crash reports" | tee -a /tmp/app.log
          fi
          # The purchase tests buy every product against Apple's StoreKit test server. They are slow,
          # so they only run when the commit message contains [store].
          if [ "$RUN_STORE_TESTS" = "true" ]; then
            set +e
            xcodebuild test-without-building -project ChargeCheck.xcodeproj -scheme ChargeCheck -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 > /tmp/tests-full.log 2>&1
            TESTS=$?
            set -e
            grep -E "error|\*\*|Test Case|XCTAssert|Executed" /tmp/tests-full.log | sort -u | cut -c1-400 | tee -a /tmp/app.log
            cp /tmp/tests-full.log /tmp/app-full.log
            exit $TESTS
          fi
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          [ "$RESULT" != "success" ] && [ -f /tmp/app-full.log ] && { echo "---- last lines ----" >> /tmp/app.log; tail -40 /tmp/app-full.log | cut -c1-400 >> /tmp/app.log; } || true
          bash .github/save-log.sh app /tmp/app.log
