# The Xcode project is created from this file in the cloud (XcodeGen), because there is no Mac.
name: ChargeCheck
options:
  bundleIdPrefix: com.rjapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ChargeCheckCore:
    path: Core
  # Same Google ads SDK version the first version of the app uses
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    minorVersion: 3.1.0
targets:
  ChargeCheck:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: ChargeCheckCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - target: ChargeCheckWidget  # widget
    entitlements:
      path: App/ChargeCheck.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rjapps.invoicepricechecker]  # widget
        # iCloud for staff phones (CloudKit sharing). Beta builds use Apple's test iCloud ("Development").
        com.apple.developer.icloud-container-identifiers: [iCloud.com.rjapps.invoicepricechecker]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Development
    scheme:
      testTargets:
        - ChargeCheckTests
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, ar, ckb, de, fr]
        CFBundleAllowMixedLocalizations: true
        CFBundleDisplayName: ChargeCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        # !!! Test mode: test ads and a "test as free user" switch. Set to false before sending for App Review.
        CCTestBuild: true
        # shared with the home screen widget
        CCAppGroup: group.com.rjapps.invoicepricechecker
        # staff phones: the business is shared through this iCloud container; invite links open the app
        CCCloudContainer: iCloud.com.rjapps.invoicepricechecker
        CKSharingSupported: true
        # the widget opens the app on the Suppliers tab
        CFBundleURLTypes:
          - CFBundleURLName: com.rjapps.invoicepricechecker
            CFBundleURLSchemes: [chargecheck]
        GADApplicationIdentifier: ca-app-pub-2905482277981262~1451903100
        NSFaceIDUsageDescription: ChargeCheck can lock with Face ID so only you can see your prices, suppliers and payments.
        NSUserTrackingUsageDescription: This lets the free version show ads that are more relevant to you. Your invoices and prices are never shared.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: pwa73g5rt2.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        NSCameraUsageDescription: ChargeCheck uses the camera to scan your supplier invoices so it can check the prices. Scans stay on your phone.
        LSSupportsOpeningDocumentsInPlace: true
        # invoices shared from WhatsApp, Mail or Files ("Open in ChargeCheck")
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF invoice
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Invoice photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.png, public.heic, public.image]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker
        PRODUCT_NAME: ChargeCheck
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  # widget-start
  # The home screen widget: what you owe your suppliers. Reads what the app writes to the shared app group.
  ChargeCheckWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: ChargeCheckCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/ChargeCheckWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rjapps.invoicepricechecker]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ChargeCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar, ckb, de, fr]
        CFBundleAllowMixedLocalizations: true
        CCAppGroup: group.com.rjapps.invoicepricechecker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker.widget
        PRODUCT_NAME: ChargeCheckWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SKIP_INSTALL: "YES"
  # widget-end
  ChargeCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "*.storekit"
      - path: Tests/Products.storekit
        buildPhase: resources
    dependencies:
      - target: ChargeCheck
      - package: ChargeCheckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
