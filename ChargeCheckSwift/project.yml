# The Xcode project is created from this file in the cloud (XcodeGen), because there is no Mac.
name: ChargeCheck
options:
  bundleIdPrefix: com.rjapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ChargeCheckCore:
    path: Core
targets:
  ChargeCheck:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: ChargeCheckCore
    scheme:
      testTargets: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChargeCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker
        PRODUCT_NAME: ChargeCheck
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
