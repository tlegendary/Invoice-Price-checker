workflows:
  ios-app-store:
    name: ChargeCheck – App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:                      # build automatically every time a change is pushed to GitHub
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true   # if two changes arrive close together, only the newest is built
    when:
      changeset:                     # skip builds when only guides/images change
        excludes:
          - '**/*.md'
          - 'app-store-screenshots/**'
          - '*.png'
    integrations:
      app_store_connect: AppStoreKey   # the name you give your App Store Connect API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rjapps.invoicepricechecker
      vars:
        APP_STORE_APPLE_ID: 6832301124   # ChargeCheck: Invoice Checker
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Copy the app into the iOS project
        script: npx cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          # Unique, always-increasing build number (date + time), so uploads never clash
          NEW=$(date -u +%Y%m%d%H%M)
          echo "Build number: $NEW"
          cd ios/App && agvtool new-version -all $NEW
      - name: Resolve Swift packages (with retries)
        script: |
          for i in 1 2 3; do
            echo "Attempt $i"
            if xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App 2>&1 | tee /tmp/spm.log | tail -40; then
              if ! grep -qi "error" /tmp/spm.log; then echo "Packages resolved"; break; fi
            fi
            echo "---- package resolution problem, retrying in 20s ----"; grep -i -B2 -A6 "error" /tmp/spm.log | head -60
            rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData/*/SourcePackages 2>/dev/null
            sleep 20
          done
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings > /tmp/settings.log 2>&1 || { echo "---- showBuildSettings failed, real error below ----"; tail -60 /tmp/settings.log; exit 1; }
      - name: Build
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers get builds without Beta Review

  # The Swift version, as a separate "ChargeCheck Beta" app in TestFlight, so the live app is never touched.
  # It only builds when ChargeCheckSwift/.beta-build changes (so ordinary pushes cost nothing).
  swift-beta:
    name: ChargeCheck Beta (Swift) – TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: swift-rewrite
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'ChargeCheckSwift/.beta-build'
    integrations:
      app_store_connect: AppStoreKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rjapps.invoicepricechecker   # brings the distribution certificate; the beta profile is fetched below
      xcode: latest
    scripts:
      - name: Make the Xcode project (beta name and bundle ID)
        script: |
          brew install xcodegen
          cd ChargeCheckSwift
          NEW=$(date -u +%Y%m%d%H%M)
          echo "Build number: $NEW"
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker$/PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker.beta/' project.yml
          sed -i '' 's/CFBundleDisplayName: ChargeCheck$/CFBundleDisplayName: CC Beta/' project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEW\"/" project.yml
          # the widget and the app group get beta names too
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker.widget$/PRODUCT_BUNDLE_IDENTIFIER: com.rjapps.invoicepricechecker.beta.widget/' project.yml
          sed -i '' 's/group.com.rjapps.invoicepricechecker\]/group.com.rjapps.invoicepricechecker.beta]/; s/CCAppGroup: group.com.rjapps.invoicepricechecker$/CCAppGroup: group.com.rjapps.invoicepricechecker.beta/' project.yml
          # The widget needs an App Group set up by hand on developer.apple.com. Until that's done
          # (Ramyar creates ChargeCheckSwift/.widget-ready), the beta is built without it.
          if [ ! -f .widget-ready ]; then python3 tools/without-widget.py project.yml; fi
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|CFBundleDisplayName\|CURRENT_PROJECT_VERSION:\|group.com" project.yml
          xcodegen generate
      - name: Beta profile 1 - find the bundle ID and certificates
        script: |
          set -e
          BETA=com.rjapps.invoicepricechecker.beta
          grep -q "PRODUCT_BUNDLE_IDENTIFIER: $BETA" ChargeCheckSwift/project.yml   # never build this as the live app
          cat > /tmp/ids.py <<'PY'
          import json, sys
          want = sys.argv[1] if len(sys.argv) > 1 else ""
          data = json.load(sys.stdin)
          data = data if isinstance(data, list) else data.get("data", [data])
          out = []
          for x in data:
              attrs = x.get("attributes", x)
              if want == "cert" and "DISTRIBUTION" not in str(attrs.get("certificateType", "")): continue
              if want.startswith("name=") and attrs.get("name") != want[5:]: continue
              out.append(x["id"])
          print(" ".join(out))
          PY
          app-store-connect bundle-ids list --bundle-id-identifier "$BETA" --strict-match-identifier --json > /tmp/bid.json
          app-store-connect certificates list --json > /tmp/certs.json
          python3 /tmp/ids.py < /tmp/bid.json > /tmp/bid.txt
          python3 /tmp/ids.py cert < /tmp/certs.json > /tmp/certs.txt
          echo "Bundle: $(cat /tmp/bid.txt)  Certificates: $(cat /tmp/certs.txt)"
          test -s /tmp/bid.txt && [ -n "$(cat /tmp/bid.txt)" ]
          [ -n "$(cat /tmp/certs.txt)" ]
      - name: Beta profile 2 - make it
        script: |
          set -e
          NAME="ChargeCheck Beta CI"
          # replace an older copy so it always matches the current certificates
          app-store-connect profiles list --type IOS_APP_STORE --json > /tmp/profiles.json 2>/dev/null || echo "[]" > /tmp/profiles.json
          for old in $(python3 /tmp/ids.py "name=$NAME" < /tmp/profiles.json); do app-store-connect profiles delete "$old" || true; done
          app-store-connect profiles create "$(cat /tmp/bid.txt)" --type IOS_APP_STORE --name "$NAME" --save --certificate-ids $(cat /tmp/certs.txt)
          if [ -f ChargeCheckSwift/.widget-ready ]; then
            WNAME="ChargeCheck Beta Widget CI"
            app-store-connect bundle-ids list --bundle-id-identifier com.rjapps.invoicepricechecker.beta.widget --strict-match-identifier --json > /tmp/wbid.json
            WBID=$(python3 /tmp/ids.py < /tmp/wbid.json)
            echo "Widget bundle: $WBID"
            [ -n "$WBID" ]
            for old in $(python3 /tmp/ids.py "name=$WNAME" < /tmp/profiles.json); do app-store-connect profiles delete "$old" || true; done
            app-store-connect profiles create "$WBID" --type IOS_APP_STORE --name "$WNAME" --save --certificate-ids $(cat /tmp/certs.txt)
          fi
      - name: Beta profile 3 - check it was saved
        script: |
          set -e
          grep -la "invoicepricechecker.beta" "$HOME/Library/MobileDevice/Provisioning Profiles/"* "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"* 2>/dev/null
      - name: Set up signing
        script: |
          set -e
          xcode-project use-profiles --project ChargeCheckSwift/ChargeCheck.xcodeproj
          grep -c "ChargeCheck Beta CI" ChargeCheckSwift/ChargeCheck.xcodeproj/project.pbxproj
      - name: Resolve Swift packages (with retries)
        script: |
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project ChargeCheckSwift/ChargeCheck.xcodeproj -scheme ChargeCheck 2>&1 | tee /tmp/spm.log | tail -20; then
              if ! grep -qi "error" /tmp/spm.log; then echo "Packages resolved"; break; fi
            fi
            rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null
            sleep 20
          done
      - name: Build
        ignore_failure: true
        script: |
          set +e
          xcode-project build-ipa --project "ChargeCheckSwift/ChargeCheck.xcodeproj" --scheme "ChargeCheck" > /tmp/build-ipa.log 2>&1
          CODE=$?
          echo $CODE > /tmp/build-code
          tail -60 /tmp/build-ipa.log
          cat /tmp/xcodebuild_logs/*.log /tmp/build-ipa.log 2>/dev/null | grep -E "error:|error -|FAILED|rovision" | sort -u | cut -c1-400 > /tmp/errors.txt
          cat /tmp/errors.txt | head -80
          exit $CODE
      # When the build fails, each step below turns red if that file has an error, so the GitHub check shows where.
      - name: "Error in Accounts.swift?"
        ignore_failure: true
        script: |
          if grep -q '/Accounts.swift:[0-9]*:[0-9]*: error' /tmp/errors.txt; then grep '/Accounts.swift:' /tmp/errors.txt | head -20; exit 1; fi
      - name: "Error in AdService.swift?"
        ignore_failure: true
        script: |
          if grep -q '/AdService.swift:[0-9]*:[0-9]*: error' /tmp/errors.txt; then grep '/AdService.swift:' /tmp/errors.txt | head -20; exit 1; fi
      - name: "Error in AppConfig.swift?"
        ignore_failure: true
